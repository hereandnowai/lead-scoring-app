
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Scoring App - HEREANDNOW AI RESEARCH INSTITUTE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Roboto, Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
      overscroll-behavior-y: none; 
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background-color: #f1f5f9; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background-color: #94a3b8; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background-color: #64748b; }
    .dark ::-webkit-scrollbar-track { background-color: #1e293b; }
    .dark ::-webkit-scrollbar-thumb { background-color: #475569; }
    .dark ::-webkit-scrollbar-thumb:hover { background-color: #64748b; }

    .glitter-text {
      color: var(--accent-text-primary); 
      background-image: linear-gradient(
        135deg,
        var(--accent-200) 20%, 
        var(--accent-500) 40%, 
        var(--accent-700) 60%, 
        var(--accent-300) 80%  
      );
      -webkit-background-clip: text;
      -moz-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent; /* Fallback for browsers not supporting -webkit-text-fill-color */

      text-shadow: 
        /* Subtle highlight (top-left) */
        -0.5px -0.5px 0px var(--glitter-highlight-color), 
        /* Main 3D shadow (bottom-right) - thinned for script */
        0.75px 0.75px 0px var(--glitter-shadow-color), 
        /* Softer overall drop shadow for general separation */
        1px 1px 2px rgba(0,0,0,0.2);
        
      display: inline-block; 
      padding-top: 0.1em; 
      padding-bottom: 0.1em; 
    }

    .homepage-hero-title-font { /* Renamed from app-name-script-font */
      font-family: 'Roboto', sans-serif;
      font-weight: 900; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      padding-top: 0; 
      padding-bottom: 0; 
      font-synthesis: none; 
    }

    .header-app-name-font { /* New class for header title */
      font-family: 'Roboto', sans-serif;
      font-weight: 500; /* Roboto Medium was used, can be 400 for regular */
      text-transform: none; /* Normal capitalization */
      letter-spacing: 0.02em; /* Slight tracking for clarity */
      font-synthesis: none; 
      color: var(--header-text-primary); /* Added for normal text color */
    }

    .no-animations *,
    .no-animations *::before,
    .no-animations *::after {
      transition: none !important;
      animation: none !important;
    }

    .form-radio { color: var(--accent-primary); }
    .form-radio:focus { 
      box-shadow: 0 0 0 2px var(--accent-focus-ring) !important;
      border-color: var(--accent-border) !important;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^18.2.0",
    "react-dom/": "https://esm.sh/react-dom@^18.2.0/", 
    "react/": "https://esm.sh/react@^18.2.0/", 
    "@google/genai": "https://esm.sh/@google/genai@^1.5.1",
    "chart.js": "https://esm.sh/chart.js@4.4.3",
    "chartjs-adapter-date-fns": "https://esm.sh/chartjs-adapter-date-fns@3.0.0",
    "chart.js/": "https://esm.sh/chart.js@^4.5.0/",
    "xlsx": "https://esm.sh/xlsx@0.18.5"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
